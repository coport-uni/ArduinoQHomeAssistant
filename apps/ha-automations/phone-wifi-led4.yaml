# Turn LED4 into an indicator of which WiFi the phone is on.
#
# Blue is the dorm, which publishes three SSIDs; green is either of
# the other two regular networks; red means none of them. Red
# deliberately covers having no WiFi at all -- being away from all
# three places usually shows up as LTE-only rather than as an unknown
# SSID, so treating unavailable/unknown as "no known network" is what
# makes the indicator useful.
#
# Red covers away-car-aircon.yaml's trigger but is slightly wider than
# it: both share the same list of known networks, and the two files
# have to be edited together, but red also shows for `unavailable` and
# `unknown`, which deliberately do NOT start the car. A red LED means
# "not at any known network"; only a red caused by a real SSID (or by
# `<not connected>`) is also a car counting down.
#
# The SSID comes from the Home Assistant companion app on the phone; it
# reports "<not connected>" when WiFi is off, which falls into the same
# default branch.
#
# Install with claude_test/ha_add_automation.py.
alias: Phone WiFi state on LED4
description: >-
  LED4 is blue on any of the dorm SSIDs, green on TP-Link_0624 or
  WUNIST_AAA, and red on any other network or on no WiFi at all.
mode: single

triggers:
  # No to/from filter: every SSID change matters, and re-applying the
  # colour the LED already shows is harmless.
  - trigger: state
    entity_id: sensor.sm_f966n_wi_fi_connection
  # Without this the LED would keep whatever colour it had before a
  # restart until the phone next changed networks.
  - trigger: homeassistant
    event: start
  # The bridge turns both LEDs off when it (re)starts, and the light
  # entity briefly goes unavailable while that happens -- including
  # during a Home Assistant restart, where it can come back after the
  # start event above. Re-applying the colour on recovery closes both
  # races.
  - trigger: state
    entity_id: light.uno_q_mcu_led4
    from: unavailable

conditions: []

actions:
  - choose:
      - alias: On any of the dorm WiFis
        conditions:
          # The dorm publishes three SSIDs (the ASUS pair is one
          # router's 5 GHz and 2.4 GHz radios), and the phone picks
          # between them on its own, so all three mean "at the dorm".
          - condition: state
            entity_id: sensor.sm_f966n_wi_fi_connection
            state:
              - "XiaomiDorm55"
              - "ASUS_55"
              - "ASUS_55_24"
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.uno_q_mcu_led4
            data:
              rgb_color: [0, 0, 255]
              brightness: 255
      - alias: On one of the other regular networks
        conditions:
          # A state condition matches any value in the list.
          - condition: state
            entity_id: sensor.sm_f966n_wi_fi_connection
            state:
              - "TP-Link_0624"
              - "WUNIST_AAA"
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.uno_q_mcu_led4
            data:
              rgb_color: [0, 255, 0]
              brightness: 255
    default:
      - alias: On no known network
        action: light.turn_on
        target:
          entity_id: light.uno_q_mcu_led4
        data:
          rgb_color: [255, 0, 0]
          brightness: 255
